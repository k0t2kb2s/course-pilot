      <stop offset="1" stop-color="#4f8bff"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottom" cx="0" cy="1" r="1">
      <stop offset="0" stop-color="#4f8bff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#4f8bff" stop-opacity="0"/>
