<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6bff"/>
      <stop offset="1" stop-color="#3f8dff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.1" cy="0" r="1">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="250" rx="18" fill="#0b0d14"/>
  <rect width="960" height="250" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="959" height="249" rx="18" fill="none" stroke="#1e2333"/>

  <!-- step 1 -->
  <g>
    <rect x="28" y="34" width="280" height="182" rx="14" fill="#10131d" stroke="#20263a"/>
    <circle cx="56" cy="62" r="14" fill="url(#accent)"/>
    <text x="56" y="67" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">1</text>
    <text x="82" y="67" fill="#eef0f7" font-size="15" font-weight="700">Download the ZIP</text>
    <text x="52" y="102" fill="#9aa3ba" font-size="12.5">Repo → green Code button →</text>
    <text x="52" y="122" fill="#9aa3ba" font-size="12.5">Download ZIP</text>
    <rect x="52" y="142" width="232" height="34" rx="8" fill="#0a0c12" stroke="#242a3d"/>
    <text x="66" y="164" fill="#cfd6e6" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">course-pilot-main/</text>
    <text x="52" y="199" fill="#6f7890" font-size="11">unzip it anywhere you like</text>
  </g>

  <!-- arrow -->
  <path d="M318 125h22m-7-7 7 7-7 7" fill="none" stroke="#3b4360" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- step 2 -->
  <g>
    <rect x="340" y="34" width="280" height="182" rx="14" fill="#10131d" stroke="#20263a"/>
    <circle cx="368" cy="62" r="14" fill="url(#accent)"/>
    <text x="368" y="67" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">2</text>
    <text x="394" y="67" fill="#eef0f7" font-size="15" font-weight="700">Open extensions</text>
    <rect x="364" y="88" width="232" height="32" rx="8" fill="#0a0c12" stroke="#242a3d"/>
    <text x="378" y="109" fill="#8fd0ff" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">chrome://extensions</text>
    <text x="364" y="142" fill="#9aa3ba" font-size="12.5">Turn on Developer mode</text>
    <rect x="364" y="154" width="96" height="20" rx="10" fill="#1b2334" stroke="#2b3550"/>
    <circle cx="450" cy="164" r="7" fill="#8a6bff"/>
    <text x="472" y="168" fill="#6f7890" font-size="11">top right</text>
    <text x="364" y="199" fill="#6f7890" font-size="11">needed for unpacked builds</text>
  </g>

  <!-- arrow -->
  <path d="M630 125h22m-7-7 7 7-7 7" fill="none" stroke="#3b4360" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- step 3 -->
  <g>
    <rect x="652" y="34" width="280" height="182" rx="14" fill="#10131d" stroke="#20263a"/>
    <circle cx="680" cy="62" r="14" fill="url(#accent)"/>
    <text x="680" y="67" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">3</text>
    <text x="706" y="67" fill="#eef0f7" font-size="15" font-weight="700">Load unpacked</text>
    <text x="676" y="100" fill="#9aa3ba" font-size="12.5">Click “Load unpacked” and pick</text>
    <text x="676" y="120" fill="#9aa3ba" font-size="12.5">the folder with manifest.json</text>
    <rect x="676" y="140" width="232" height="34" rx="8" fill="#0a0c12" stroke="#242a3d"/>
    <text x="690" y="162" fill="#cfd6e6" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">course-pilot-main/</text>
    <text x="676" y="199" fill="#3fd68a" font-size="11">done. pin it to the toolbar</text>
  </g>
</svg>
